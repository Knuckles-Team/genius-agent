[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "genius-agent"
version = "4.1.0"
description = "GeniusAgent Search Engine for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12,<3.15"
dependencies = [ "universal-skills[web-crawler,web-search]", "systems-manager[mcp,agent]", "agent-utilities[agent-runtime,logfire,graphos]>=2.0.0,<3.0.0", "agent-connector-sdk>=0.1.0,<1.0.0",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.scripts]
genius-mcp = "genius_agent.mcp_server:mcp_server"

[project.entry-points."agent_utilities.skill_providers"]
genius-agent = "genius_agent.skills"

[project.entry-points."agent_utilities.ontology_providers"]
genius-agent = "genius_agent.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
genius-agent = "genius_agent.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
genius-agent = "genius_agent.prompts"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk>=0.1.0,<1.0.0", "agent-utilities[graphos]>=2.0.0,<3.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire,graphos]>=2.0.0,<3.0.0",]
all = [ "agent-connector-sdk>=0.1.0,<1.0.0", "agent-utilities[agent-runtime,logfire,graphos]>=2.0.0,<3.0.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.uv.sources]
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }
agent-connector-sdk = { path = ".uv-workspace-siblings/agent-connector-sdk", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
genius_agent = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]
